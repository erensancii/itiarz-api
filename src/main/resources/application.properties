server.port=${SERVER_PORT:8080}

spring.application.name=itiarz-api

# application role: NOSUPERUSER NOBYPASSRLS, owns no tables (infra/postgres/init/01-init.sh)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/itiarz}
spring.datasource.username=${DB_APP_USER:itiarz_app}
spring.datasource.password=${DB_APP_PASSWORD:app_dev_only_change_me}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# migrations run as the schema owner; grants in V3 target the app role
spring.flyway.enabled=true
spring.flyway.user=${DB_OWNER_USER:itiarz_owner}
spring.flyway.password=${DB_OWNER_PASSWORD:owner_dev_only_change_me}
spring.flyway.placeholders.appRole=${DB_APP_USER:itiarz_app}

management.endpoints.web.exposure.include=health

# Admin API (client_credentials, service account of itiarz-api-admin) over the internal network
app.keycloak.internal-url=${KC_INTERNAL_URL:http://localhost:8081}
app.keycloak.realm=${KC_REALM:itiarz}
app.keycloak.admin-client-id=itiarz-api-admin
app.keycloak.admin-client-secret=${KC_ADMIN_CLIENT_SECRET:admin_secret_dev_only_change_me}

# demo tenants, members and cases (DemoSeeder); docker-compose enables it for local dev
app.seed-demo=${SEED_DEMO:false}

# issuer as seen by browsers/tokens (iss = public-url/realms/<realm>)
app.security.keycloak.public-url=${KC_PUBLIC_URL:http://localhost:8081}
# JWKS fetched over the internal network
app.security.keycloak.internal-url=${KC_INTERNAL_URL:http://localhost:8081}
app.security.keycloak.realm=${KC_REALM:itiarz}
