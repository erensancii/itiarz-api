server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: disputepilot-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/disputepilot}
    username: ${DB_USER:disputepilot}
    password: ${DB_PASSWORD:localdev_only_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  seed-demo: ${SEED_DEMO:true}
