server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: itiarz-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/itiarz}
    # application role: NOSUPERUSER NOBYPASSRLS, owns no tables (infra/postgres/init/01-init.sh)
    username: ${DB_APP_USER:itiarz_app}
    password: ${DB_APP_PASSWORD:app_dev_only_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # migrations run as the schema owner; grants in V3 target the app role
    user: ${DB_OWNER_USER:itiarz_owner}
    password: ${DB_OWNER_PASSWORD:owner_dev_only_change_me}
    placeholders:
      appRole: ${DB_APP_USER:itiarz_app}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  keycloak:
    # Admin API (client_credentials, service account of itiarz-api-admin) over the internal network
    internal-url: ${KC_INTERNAL_URL:http://localhost:8081}
    realm: ${KC_REALM:itiarz}
    admin-client-id: itiarz-api-admin
    admin-client-secret: ${KC_ADMIN_CLIENT_SECRET:admin_secret_dev_only_change_me}
  # demo tenants, members and cases (DemoSeeder); docker-compose enables it for local dev
  seed-demo: ${SEED_DEMO:false}
  security:
    keycloak:
      # issuer as seen by browsers/tokens (iss = public-url/realms/<realm>)
      public-url: ${KC_PUBLIC_URL:http://localhost:8081}
      # JWKS fetched over the internal network
      internal-url: ${KC_INTERNAL_URL:http://localhost:8081}
      realm: ${KC_REALM:itiarz}
